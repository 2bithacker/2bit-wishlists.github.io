          struggles so hard when fighting elite+ baddies that it's hard to
          justify using this over an auto rifle - especially since kinetic
          tremors has tremendous value when fighting barrier champions
          specifically, but doesn't matter much against the other two types and
          though typically I am a lightweight pulse enjoyer (one of my favorite
          archetypes ever in all of Destiny) it being an overload stun at base
          means that this just is not quite good enough to be a super meta
          crusher in highend content - it should be a very fun gun though if you
          enjoy this archetype like I do.
