  - name: Parabellum
    hash: 3769072067
    rolls:
      - tags: [pve, god-pve]
        perks:
          - [Arrowhead Brake, Fluted Barrel]
          - [Alloy Magazine]
          - [Heal Clip]
          - [Attrition Orbs, Incandescent]
        masterwork: [Reload, Range]
        text: &parabellum >-
          This is very close to being very good. The only place it falls down is
          that attrition orbs is in the wrong column since basically SMGs are
          pretty only attrition orbs printers in this final update. Adaptives
          should at 900rpm, which is the same as the vaunted lightweight frame,
          so theoretically this should print orbs as fast as the more famous
          Yeartide Apex, but instead of a damage perk pairing like Chaos
          Reshaped (which is too buggy to be used anyway) or a splash perk like
          Incandescent it is instead paired with Heal Clip and Rewind Rounds. RR
          allows the gun to perform the "orb printer" functionality really well
          without having to pause to reload, and Heal Clip does give a small
          survivability boost which could be clutch for a certain kind of
          player. Whether this is actually going to be a good weapon for
          high-end content remains to be seen. It lacks a lot of the flashiness
          that would get this cooking in lower end content and in higher end
          content it is still fighting an uphill battle as an SMG but it does
          have its very specific niche - and of course the origin trait makes
          this always worth considering.
      - tags: [pve]
        perks:
